name: Build and deploy GH Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two deploys race to force-push gh-pages.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Publish site
    runs-on: ubuntu-latest
    permissions:
      # The action force-pushes the built site to the gh-pages branch.
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Build with Zola and deploy to gh-pages
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
